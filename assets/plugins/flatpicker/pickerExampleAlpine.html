<!-- HTML EXAMPLE OF DATE PICKER WITH FLATPICKER PLUGINS AND ALPINEJS  -->
<!-- https://flatpickr.js.org/ -->

<div x-data="" x-init="flatpickrInstance = flatpickr($el.querySelector('input'), {dateFormat: 'Y-m-d',   enable: ['2025-03-30'] })">
    <input name="date" id="date" type="text" placeholder="">
    <label for="date">Дата</label>
</div>
