            <div class="flex flex-row items-center gap-5">
                <i class="fa-solid fa-truck-fast text-[26px] dark:text-gray-200" aria-hidden="true"></i>
                <div>
                    <p class="text-base font-bold dark:text-gray-200">Безплатна доставка</p>
                    <p class="text-base dark:text-gray-200">Безплатна доставка над 100 лв.</p>
                </div>
            </div>

            <div class="flex flex-row items-center gap-5">
                <i class="fa-solid fa-phone-volume text-[26px] dark:text-gray-200" aria-hidden="true"></i>
                <div>
                    <p class="text-base font-bold dark:text-gray-200">Обадете ни се </p>
                    <p class="text-base dark:text-gray-200"><a href="tel:+359888039850">0888 039 850</a></p>
                </div>
            </div>

            <div class="flex flex-row items-center gap-5">
                <i class="fa-regular fa-circle-check text-[26px] dark:text-gray-200" aria-hidden="true"></i>

<div>
    <div class="lg:mb-[100px] py-20 ">
        <div class="container grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-2 gap-10 xl:grid-cols-4" apidata="get.products" data-show_filters="true" data-subcategories="true" data-only_instock="0" keyname="products" options-chnageurl="true">
            <template x-for="product in data.products.result">

                <div class="ribbon-wrapper relative  dark:text-gray-200">
                    <template x-if="product.variations[0].promoprice != 0">
                        <div class="ribbon ribbon-secondary ribbon-clip !top-[10px]">Sale</div>
                    </template>
                    <div x-show="product.isNew" x-cloak="">
                        <div class="ribbon ribbon-success ribbon-clip " :class="product.variations[0].promoprice != 0 ? '!top-[55px]': '!top-[10px]'">New</div>
                    </div>

                    <div class=" relative  text-center shadow-xl flex flex-col justify-between h-full bg-neutral-50 dark:bg-gray-950" x-data="{hover:false}" @mouseenter="hover = true" @mouseleave="hover = false">
                        <div class="  lg:h-[300px] bg-white dark:bg-gray-950">
                            <div class="absolute top-4 right-4 z-30" x-data="{wishlist: product.isWishlisted}">
                                <template x-if="!wishlist">
                                    <i class="fa-regular fa-heart text-[22px] cursor-pointer drop-shadow-xl hover:text-red-600" @click="alpineListeners('Shop.post_wishlist', $event); wishlist =! wishlist" :data-object_id="product.id"></i>
                                </template>

                                <template x-if="wishlist">
                                    <i class="fa-solid fa-heart text-red-600 fa-heart text-[22px] cursor-pointer drop-shadow-xl hover:text-red-600" @click="alpineListeners('Shop.delete_wishlist', $event); wishlist =! wishlist" :data-id="product.id"></i>
                                </template>

                            </div>
                            <a @click="href(product.url)">
                                <img :src="product.images[0] ? product.images[0].url_10x10 : data.settings.logo" alt="" class="!m-0 w-full  lg:h-full lg:object-scale-down cursor-pointer">
                                <!-- <div class="bg-neutral-100 animate-pulse shadow animate-infinite animate-duration-[3000ms]  w-full h-full"></div> -->
                            </a>
                        </div>

                        <div class="px-3 ">
                            <a @click="href(product.url)">
                                <p x-text="product.title" @click="href(product.url)" class="pt-[15px]  cursor-pointer hover:text-orange-400">Deba Fuji Ryutoku, Деба нож, 15 см, FC-572</p>

                                <template x-if="product.variations[0].promoprice != 0">
                                    <div class="flex items-center justify-center py-1">
                                        <p class="text-lg font-bold text-red-400" x-text="product.variations[0].selling_price">750</p>
                                        <span class="text-base ml-2 text-red-400" x-text="product.variations[0].currency">лв.</span>
                                        <p class="text-base font-bold">
                                            <s>
                                                <span x-text="product.variations[0].price">890</span>
                                                <span x-text="product.variations[0].currency">лв.</span>
                                            </s>
                                        </p>

                                    </div>
                                </template>

                                <template x-if="product.variations[0].promoprice == 0">
                                    <p x-text="product.variations[0].price.toFixed(2) + ' лв.'" class=" py-1 text-[17px] text-red-600 font-bold">80.00 BGN</p>
                                </template>

                            </a>
                        </div>

                        <div class="px-3 py-3 w-full">
                            <button @click="alpineListeners('post.carts', $event)" :data-product_id="product.id" :data-variation_id="product.variations[0].id" :data-qty="1" name="button" class="flex items-center justify-center w-full py-2 bg-stone-900   dark:bg-gray-900 dark:hover:text-orange-400 text-white hover:bg-stone-800 ">
                                <svg xmlns="http://www.w3.org/2000/svg" class="shrink-0 mr-3 h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path>
                                </svg>
                                Купи
                            </button>

                        </div>

                    </div>
                </div>
            </template>

            <template x-if="!data.products.result[0]">
                <p class=" mx-5 py-10 mt-10 px-5">Няма намерени продукти</p>
            </template>

        </div>
    </div>
</div>

<div class="!bg-neutral-50 !py-6 md:!py-[100px] dark:!bg-gray-900 w-full is-section is-section-auto last-box" apidata2="Blog.get_blogPosts" keyname="latestBlog" data-limit="3">
    <div class="container">
        <div class="grid grid-cols-1  lg:grid-cols-3 gap-10">
            <template x-for="blog in data.latestBlog.result">

                <div class="flex flex-col  items-center relative bg-white dark:bg-gray-950 shadow-2xl p-3 md:p-8">

                    <img :src="blog.images[0] ? blog.images[0].url_10x10 : data.settings.logo" alt="" @click="href(blog.url)" class="h-[400px] w-full object-cover !m-0">

                    <div class="flex items-between flex-col mt-4">

                        <p class="text-lg font-bold line-clamp-2 dark:text-gray-200" @click="href(blog.url)" x-text="blog.title">Японски нож на готвача Сантоку - как се използва?</p>

                        <p class="text-base pt-2 line-clamp-4 dark:text-gray-200" @click="href(blog.url)" x-text="blog.seo_description"> Сантоку е японската версия на европейския нож на готвача. Докато готварския нож в Европа се разпознава по заострения си връх и изпъкнал ръб, Сантоку има леко по-заоблена форма на острието и прав ръб. </p>

                    </div>
                </div>
            </template>

        </div>
    </div>
</div>
